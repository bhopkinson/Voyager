services:
  db-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: voyager_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voyager_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - test_db_data:/var/lib/postgresql/data

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db-test:5432/voyager_test
      VOYAGER_SKIP_STARTUP_MIGRATIONS: "1"
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: pytest tests/ -v

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
    command: npm test -- --watchAll=false

volumes:
  test_db_data:
