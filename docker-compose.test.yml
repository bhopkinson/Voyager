services:
  db-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: voyager_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voyager_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - test_db_data:/var/lib/postgresql/data

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db-test:5432/voyager_test
      VOYAGER_SKIP_STARTUP_MIGRATIONS: "1"
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: pytest tests/ -v

  backend-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db-test:5432/voyager_test
      VOYAGER_ENABLE_TEST_ROUTES: "1"
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()\""]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
    command: npm test -- --watchAll=false

  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend-e2e:8000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
      WATCHPACK_POLLING: "true"
    depends_on:
      backend-e2e:
        condition: service_healthy
    command: npm run dev -- -H 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  e2e-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://frontend-e2e:3000
      PLAYWRIGHT_API_BASE_URL: http://backend-e2e:8000
    depends_on:
      frontend-e2e:
        condition: service_healthy
    command: npm run test:e2e

volumes:
  test_db_data:
